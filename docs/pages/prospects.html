<div class="player_page" id="prospects" data-role="meta">
  <div class="player_header"><div class="player_name">Prospects</div></div>
  <div class="static_page prospects_page">
    <p class="snapshot_note">Rankings from the prospect sheets. Linked names open player cards, which may still show a previous team.</p>
    <div class="snapshot_grid prospect_grid">
      <section>
        <h3>Top 100 with player cards</h3>
        <div class="prospect_table_wrap">
          <table aria-label="Top 100 prospects with dashboard cards"><thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">Team</th><th scope="col">Pos</th><th scope="col">Level</th><th scope="col">ETA</th></tr></thead><tbody data-prospect-national></tbody></table>
        </div>
      </section>
      <section>
        <h3>Organization top 10</h3>
        <label for="prospect_org">Organization</label>
        <select id="prospect_org"></select>
        <div class="prospect_table_wrap">
          <table aria-label="Organization top 10 prospects"><thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">Pos</th><th scope="col">Level</th><th scope="col">ETA</th></tr></thead><tbody data-prospect-org></tbody></table>
        </div>
      </section>
    </div>
  </div>
</div>
